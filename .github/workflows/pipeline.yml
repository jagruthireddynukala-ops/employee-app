
name: Employee App CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: jagruthiacr
  ACR_LOGIN_SERVER: jagruthiacr.azurecr.io
  IMAGE_NAME: employee-app
  AKS_RESOURCE_GROUP: Jagruthiaks-rg
  AKS_CLUSTER_NAME: Jagruthi-aks

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy to AKS
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify Azure configuration
      - name: Verify Azure Configuration
        shell: bash
        run: |
          if [ "${{ secrets.AZURE_CLIENT_ID }}" != "db2ab783-7ae1-4082-8619-c86571511ece" ]; then
            echo "ERROR: AZURE_CLIENT_ID is incorrect"
            exit 1
          fi

          if [ "${{ secrets.AZURE_TENANT_ID }}" != "2e08f700-0610-488d-9a1e-2e456a2a949c" ]; then
            echo "ERROR: AZURE_TENANT_ID is incorrect"
            exit 1
          fi

          if [ "${{ secrets.AZURE_SUBSCRIPTION_ID }}" != "996d1b6a-eec5-418d-b351-9af66fcd25dc" ]; then
            echo "ERROR: AZURE_SUBSCRIPTION_ID is incorrect"
            exit 1
          fi

          echo "Azure configuration is correct"

      # 3. Login to Azure using GitHub OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Verify Azure account
      - name: Verify Azure Login
        shell: bash
        run: |
          az account show --query "{subscription:id,tenant:tenantId}" -o table

      # 5. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # 6. Setup QEMU for ARM64 image build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 7. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # 9. Get AKS credentials
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # 10. Check Kubernetes connection
      - name: Check AKS Connection
        run: |
          kubectl get nodes

      # 11. Apply Kubernetes manifests
      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      # 12. Update deployment with new image
      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/employee-app \
            employee-app=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 13. Wait for deployment rollout
      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/employee-app --timeout=5m

      # 14. Verify Kubernetes pods
      - name: Verify Kubernetes Pods
        run: |
          kubectl get pods -o wide

      # 15. Verify Kubernetes service
      - name: Verify Kubernetes Service
        run: |
          kubectl get service employee-app-service

      # 16. Verify Application Gateway ingress
      - name: Verify Application Gateway Ingress
        run: |
          kubectl get ingress employee-app-ingress