
name: Employee App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: jagruthiacr
  ACR_LOGIN_SERVER: jagruthiacr.azurecr.io
  IMAGE_NAME: employee-app
  AKS_RESOURCE_GROUP: Jagruthiaks-rg
  AKS_CLUSTER_NAME: Jagruthi-aks

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy to AKS
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Azure using GitHub OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Login to Azure Container Registry
      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # 4. Setup QEMU for ARM64 image build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 5. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Build and push Docker image to ACR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # 7. Get AKS credentials
      - name: Get AKS Credentials
        run: az aks get-credentials --resource-group ${{ env.AKS_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }} --admin --overwrite-existing

      # 8. Apply Kubernetes manifests
      - name: Apply Kubernetes Manifests
        run: kubectl apply -f k8s/

      # 9. Update deployment with the new image
      - name: Update Kubernetes Deployment
        run: kubectl set image deployment/employee-app employee-app=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 10. Wait for deployment rollout
      - name: Wait for deployment rollout
        run: kubectl rollout status deployment/employee-app --timeout=5m

      # 11. Verify pods
      - name: Verify Kubernetes Pods
        run: kubectl get pods -o wide

      # 12. Verify service
      - name: Verify Kubernetes Service
        run: kubectl get service employee-app-service

      # 13. Verify ingress
      - name: Verify Application Gateway Ingress
        run: kubectl get ingress employee-app-ingress
