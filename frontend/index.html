<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Employee Management</h1>

        <p class="subtitle">
            Employee information from PostgreSQL
        </p>

        <!-- Add Employee Form -->

        <div class="form-container">

            <h2>Add Employee</h2>

            <form id="employeeForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Name"
                    required
                >

                <input
                    type="text"
                    id="role"
                    placeholder="Role"
                    required
                >

                <input
                    type="text"
                    id="department"
                    placeholder="Department"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <button type="submit">
                    Add Employee
                </button>

            </form>

            <p id="message"></p>

        </div>


        <!-- Employee Table -->

        <div class="table-container">

            <h2>Employees</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Email</th>
                    </tr>

                </thead>

                <tbody id="employeeTable">

                </tbody>

            </table>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
